name: Update Hokkaido weather and transport data
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official data
        run: python3 scripts/update_data.py
      - name: Commit updated status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/status.json
          git diff --cached --quiet || git commit -m 'Update Hokkaido official status data'
          git push
